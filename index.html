<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nanoei.ai</title>
  <link rel="icon" type="image/png" href="nano.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #3f4555;
      color: #ffffff; /* Light text for better contrast */
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    /* nav bar button styling */
    .nav {
      font-family: "IBM Plex Sans", sans-serif;
      color: grey;
      text-decoration: none;
      font-size: 1.40rem;
      font-weight: 500;
      align-items: center;
      justify-content: center;
      display: flex;
      gap: 1.5rem;
      a {color: grey; text-decoration: none;}
      margin-top: 50px;
    }

    .nav:hover {
      color: #ffffff;
    }

    html {
      scroll-behavior: smooth;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      img {
        width: 50px;
        height: 50px;
        margin-right: 10px;
        filter: drop-shadow(0 0 10px #383838);
      }
    }

    .about-section, .changelog-section, .faq-section, .contact-section, .downloads-section, .contribute-section {
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 2rem;
      font-weight: 500;
      font-family: "IBM Plex Sans", sans-serif;
      color: #c0baaa;

    }

    .content-box {
      background-color: #3f4555;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem;
      border-radius: 10px;
      border: 5px solid #c0baaa;
      color: #c0baaa;
      max-width: 500px;

    }

    .content-box h2 {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 2rem;
      margin-top: 0;
      margin-bottom: 0;
      text-align: left;
    }

    </style>
</head>
<body>
  
  
  <nav class="nav">
    <a href="#about">About</a>  <a href="#changelog">Changelog</a>  <a href="#faq">FAQ</a>  <a href="#contact">Contact</a>  <a href="#downloads">Downloads</a>  <a href="#contribute">Contribute</a>
  </nav>

  <section id="about" class="content-box">
    <h2>About</h2>
  </section>
